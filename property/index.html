<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>NIDO · Vivienda</title><style>body{margin:0;background:#f7f3ee;color:#232321;font:17px system-ui,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{font-size:26px}a,button{display:inline-block;padding:14px 18px;border-radius:16px;background:#d5b188;color:#232321;text-decoration:none;border:0;font:inherit;margin:6px 8px 6px 0}#photos{display:flex;overflow:auto;gap:10px;scroll-snap-type:x mandatory}img{width:100%;max-height:420px;object-fit:cover;border-radius:18px;scroll-snap-align:start}#description{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#65625c}</style></head><body><main><p>NIDO</p><h1 id="title">…</h1><p id="status" role="status"></p><section id="listing" hidden><div id="photos"></div><h2 id="price"></h2><p id="location"></p><p id="facts"></p><p id="description"></p><ul id="features"></ul><a id="open">Abrir en NIDO</a></section></main><script>
'use strict';
const params=new URLSearchParams(location.search),id=params.get('id'),lang=['ru','en','es'].includes(params.get('lang'))?params.get('lang'):(navigator.language||'es').slice(0,2);
const text={ru:{load:'Загружаем объявление…',missing:'Объявление больше недоступно.',error:'Не удалось загрузить объявление. Обновите страницу позже.',open:'Открыть в NIDO',rent:'Аренда',sale:'Покупка',month:'/ мес.',facts:'спален · ванных · м²'},en:{load:'Loading listing…',missing:'This listing is no longer available.',error:'Could not load this listing. Please refresh later.',open:'Open in NIDO',rent:'Rent',sale:'Buy',month:'/ month',facts:'bedrooms · bathrooms · m²'},es:{load:'Cargando anuncio…',missing:'Este anuncio ya no está disponible.',error:'No se pudo cargar el anuncio. Actualiza la página más tarde.',open:'Abrir en NIDO',rent:'Alquiler',sale:'Compra',month:'/ mes',facts:'habitaciones · baños · m²'}}[lang]||{load:'Loading…',missing:'Unavailable',error:'Please retry later',open:'Open NIDO',rent:'Rent',sale:'Buy',month:'/ month',facts:'bedrooms · bathrooms · m²'};
document.documentElement.lang=lang;const set=(key,value)=>document.getElementById(key).textContent=String(value??'');
(async()=>{set('status',text.load);if(!id||!/^\d+$/.test(id)||!Number.isSafeInteger(Number(id))||Number(id)<1){set('status',text.missing);return}try{const response=await fetch('https://mwqahwtdvmlwfgsychtg.supabase.co/functions/v1/public-property?id='+encodeURIComponent(id),{cache:'no-store'});if(response.status===404){set('status',text.missing);return}if(!response.ok)throw Error('unavailable');const {property:p}=await response.json();if(!p||p.id!==Number(id))throw Error('invalid');set('title',p.title);document.title='NIDO · '+p.title;set('price',(p.transaction_type==='Rent'?text.rent:text.sale)+' · $'+Number(p.price).toLocaleString()+(p.transaction_type==='Rent'?' '+text.month:''));set('location',p.location);set('facts',`${p.bedrooms} · ${p.bathrooms} · ${p.area} (${text.facts})`);set('description',p.description);for(const feature of (p.amenities||[])){const li=document.createElement('li');li.textContent=feature;document.getElementById('features').append(li)}for(const raw of (p.photos||[])){try{const u=new URL(raw);if(u.protocol!=='https:')continue;const image=document.createElement('img');image.src=u.href;image.alt=p.title;image.loading='lazy';document.getElementById('photos').append(image)}catch{}}const open=document.getElementById('open');open.textContent=text.open;open.href='nido-staging://property/'+id;set('status','');document.getElementById('listing').hidden=false}catch{set('status',text.error)}})();
</script></body></html>
