.photoNav.prev{left:11px}.photoNav.next{right:11px}

button{cursor:pointer;appearance:none;min-height:45px;border:1px solid #cbd8c9;border-radius:12px;background:#f8faf7;color:#214329;font:700 14px system-ui;padding:9px 13px}
button.strong{background:#537f54;color:#fff;border-color:#537f54}

async function backend(endpoint,data){
 const response=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},
  body:JSON.stringify(data),cache:'no-store'});
 if(!response.ok)throw Error('SERVER_REJECTED');
 return response.json();
}
function postFeedback(action,id){
 if(demo)return Promise.resolve({ok:true,demo:true});
 return backend(API+'?api=event',{token,action,property_id:id});
}
async function postFlexible(api,data){
 if(demo)return {code:'OK',demo:true};
 return backend(FLEX+'?api='+api,Object.assign({token},data));
}

 const photos=(Array.isArray(property.photos)?property.photos:[]).slice(0,12).flatMap(raw=>{
  if(typeof raw!=='string')return [];
  try{const url=new URL(raw);return url.protocol==='https:'?[url.href]:[]}catch{return []}
 });
 if(!photos.length){media.append(make('span',L.noPhoto,'noPhoto'));return media}
 const img=make('img');img.alt=property.title||L.noPhoto;img.decoding='async';img.loading='lazy';
 const counter=make('span',undefined,'photoIndex');let idx=0,errors=0;
 const controls=[];
 function show(){img.src=photos[idx];counter.textContent=(idx+1)+' / '+photos.length}
 function advance(delta){errors=0;idx=(idx+delta+photos.length)%photos.length;show()}
 img.addEventListener('error',()=>{
  errors++;if(errors>=photos.length){img.remove();counter.remove();controls.forEach(a=>a.remove());
   media.append(make('span',L.noPhoto,'noPhoto'));return}
  idx=(idx+1)%photos.length;show();
 });
 media.append(img);
 if(photos.length>1){
  const prev=make('button','‹','photoNav prev'),next=make('button','›','photoNav next');
  prev.type=next.type='button';
  prev.setAttribute('aria-label','Previous photo');next.setAttribute('aria-label','Next photo');
  prev.addEventListener('click',()=>advance(-1));next.addEventListener('click',()=>advance(1));
  controls.push(prev,next);media.append(prev,next,counter);
  let sx=0,sy=0;media.addEventListener('touchstart',e=>{
   if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}
  },{passive:true});
  media.addEventListener('touchend',e=>{
   if(!e.changedTouches.length)return;
   const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
   if(Math.abs(dx)>55&&Math.abs(dx)>1.5*Math.abs(dy))advance(dx<0?1:-1);
  },{passive:true});
 }
 show();return media;
}
function card(property,reasons){
 const id=Number(property.id);listed.set(id,property);
 const article=make('article',undefined,'card');article.append(gallery(property));
 const body=make('div',undefined,'content');
 body.append(make('h2',property.title||'#'+id));
 body.append(make('div',[property.city,property.location].filter(Boolean).join(' · '),'location'));
 body.append(make('div','$'+Number(property.price||0).toLocaleString('en-US'),'price'));
 const facts=make('div',undefined,'facts');
 if(property.bedrooms!==null&&property.bedrooms!==undefined)facts.append(make('span',property.bedrooms+' '+L.beds));
 if(property.bathrooms!==null&&property.bathrooms!==undefined)facts.append(make('span',property.bathrooms+' '+L.baths));
 if(property.area!==null&&property.area!==undefined)facts.append(make('span',property.area+' '+L.area));
 body.append(facts);
 const reason=make('div',undefined,'reason');
 reason.append(make('small',L.reason));reason.append(make('span',reasons[String(id)]||L.noReason));
 body.append(reason);
 const desc=make('details',undefined,'description');
 desc.append(make('summary',L.description));
 desc.append(make('p',property.description||L.noDescription));
 if(Array.isArray(property.amenities)&&property.amenities.length)desc.append(make('p',L.amenities+': '+property.amenities.join(' · ')));
 const href='https://kostaamigo.github.io/nido-apk-distribution/property/?id='+id+'&lang='+lang;
 const link=make('a',L.details+' ↗','detailsLink');link.href=href;link.target='_blank';link.rel='noopener noreferrer';
 desc.append(link);body.append(desc);
 const actions=make('div',undefined,'actions');
 const dislike=make('button','👎 '+L.dislike),like=make('button','👍 '+L.like);
 function mark(active,button){
  const previous=reactions.get(id);
  // In a demo do not silently claim server persistence.
  if(previous===active){banner(demo?L.localSaved:L.liked);return}
  like.disabled=dislike.disabled=true;
  postFeedback(active,id).then(()=>{
   reactions.set(id,active);
   like.classList.toggle('chosen',active==='liked');
   dislike.classList.toggle('negative',active==='disliked');
   banner(demo?L.localSaved:L.liked);
  }).catch(()=>banner(L.error,true)).finally(()=>{like.disabled=dislike.disabled=false});
 }
 like.addEventListener('click',()=>mark('liked',like));dislike.addEventListener('click',()=>mark('disliked',dislike));
 actions.append(dislike,like);body.append(actions);
 const pick=make('button','+ '+L.pick,'pick');
 pick.addEventListener('click',()=>addSelection(id,pick));body.append(pick);
 const noteBox=make('details',undefined,'noteDetails'),summary=make('summary',L.yourNote);
 const text=make('textarea');text.maxLength=600;text.placeholder=L.noteHint;
 const saved=make('div',undefined,'savedNote');
 const save=make('button',L.saveNote);save.type='button';
 save.addEventListener('click',async()=>{
  const value=text.value.trim();
  if(!value||value.length>600){banner(L.error,true);return}
  save.disabled=true;
  try{await postFlexible('note',{property_id:id,comment:value});notes.set(id,value);
   saved.textContent=value;banner(demo?L.localSaved:L.noteSaved)}
  catch{banner(L.error,true)}finally{save.disabled=false}
 });
 noteBox.append(summary,text,save,saved);body.append(noteBox);
 article.append(body);return article;
}
function timeStatus(value){
 const labels={requested:L.statusRequested,checking:L.statusChecking,
  confirmed:L.statusConfirmed,same_day_change_proposed:L.statusTime,
  replacement_proposed:L.statusReplacement,unavailable:L.statusUnavailable,
  cancelled:L.statusCancelled,completed:L.statusCompleted};
 return labels[value]||L.statusDraft;
}
async function statusPlan(){
 if(!currentRequest||demo)return;
 const data=await postFlexible('status',{receipt:currentRequest.receipt});
 showPlan(data.items||[],false,data.preferred_day,data.preferred_window);
}
function showPlan(items,isDemo,day,window){
 const section=el('planStatus');section.replaceChildren();section.hidden=false;
 section.append(make('h2',L.statusTitle));
 section.append(make('p',day+' · '+(L[window]||L.flexible),'small'));
 section.append(make('p',isDemo?L.demoPlan:L.sent,'small'));
 if(!isDemo){
  const refresh=make('button',L.statusRefresh);
  refresh.addEventListener('click',()=>statusPlan().catch(()=>banner(L.error,true)));
  section.append(refresh);
 }
 for(const item of items){
  const property=listed.get(Number(item.property_id));
  const card=make('div',undefined,'item');
  card.append(make('strong',property?.title||'#'+item.property_id));
  card.append(make('span',timeStatus(item.status),'pill'));
  if(item.proposed_window)card.append(make('div',item.proposed_window,'small'));
  if(item.broker_note)card.append(make('p',item.broker_note,'small'));
  const currentResponse=item.responded_proposal_number===item.proposal_number;
  if(currentResponse&&item.client_response&&item.client_response!=='none')
   card.append(make('p',L.proposalPending,'small'));
  const proposed=item.status==='same_day_change_proposed'||item.status==='replacement_proposed';
  if(proposed&&!currentResponse&&!isDemo){
   for(const [text,response] of [
    [item.status==='same_day_change_proposed'?L.acceptTime:L.acceptReplacement,
     item.status==='same_day_change_proposed'?'accept_time':'accept_replacement'],
    [L.decline,'decline_change']]){
    const btn=make('button',text);btn.addEventListener('click',async()=>{
     btn.disabled=true;
     try{await postFlexible('respond',{receipt:currentRequest.receipt,property_id:item.property_id,
       proposal_number:item.proposal_number,response});
      banner(L.accepted);await statusPlan()}
     catch{banner(L.error,true)}finally{btn.disabled=false}
    });card.append(btn)
   }
  }
  if(item.replacement_property_id){
   const link=make('a',L.viewOther+' ↗','detailsLink');
   link.href='https://kostaamigo.github.io/nido-apk-distribution/property/?id='+item.replacement_property_id+'&lang='+lang;
   link.rel='noopener noreferrer';link.target='_blank';card.append(link);
  }
  section.append(card);
 }
 section.scrollIntoView({behavior:'smooth',block:'start'});
}
function domToday(){
 const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Santo_Domingo',
   year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
 const get=key=>parts.find(p=>p.type===key)?.value||'';
 return get('year')+'-'+get('month')+'-'+get('day');
}
el('openPlan').addEventListener('click',()=>{
 if(!selected.size)return;
 el('planSelected').textContent=L.basket+' '+selected.size;
 const today=domToday();
 el('day').min=today;
 if(!el('day').value||el('day').value<today)el('day').value=today;
 el('planDialog').showModal();
});
el('sendPlan').addEventListener('click',async()=>{
 const day=el('day').value,window=el('window').value;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||day<domToday()){banner(L.invalidDay,true);return}
 const forwarded=el('forwarded').checked;
 const whatsapp=el('guestWhatsapp').value.replace(/[^0-9]/g,'');
 if(forwarded&&!/^[0-9]{8,15}$/.test(whatsapp)){banner(L.invalidContact,true);return}
 if(!selected.size)return;
 const chosen=[...selected],button=el('sendPlan');
 button.disabled=true;
 const input={property_ids:chosen,day,window,note:el('planNote').value,
   forwarded,name:forwarded?el('guestName').value:'',whatsapp:forwarded?whatsapp:''};
 const signature=JSON.stringify(input);
 if(!pendingRequest||pendingRequest.signature!==signature){
   pendingRequest={signature,request_key:crypto.randomUUID(),
     receipt:Array.from(crypto.getRandomValues(new Uint8Array(32)),
       b=>b.toString(16).padStart(2,'0')).join('')};
 }
 const requestKey=pendingRequest.request_key,receipt=pendingRequest.receipt;
 try{
  const data=await postFlexible('plan',Object.assign({},input,{
   request_key:requestKey,receipt,
  }));
  currentRequest={request_key:requestKey,receipt};pendingRequest=null;
  if(!demo){
   try{sessionStorage.setItem('nido:guestplan:'+token,JSON.stringify(currentRequest))}catch{}
  }
  el('planDialog').close();
  banner(demo?L.demoPlan:(data.already_requested?L.already:L.sent));
  if(demo)showPlan(chosen.map(property_id=>({property_id,status:'requested'})),true,day,window);
  else await statusPlan();
 }catch{banner(L.error,true)}finally{button.disabled=false}
});
async function showMap(points){
 const mount=el('mapCanvas');
 if(mapLoaded){mount.hidden=!mount.hidden;el('mapToggle').textContent=mount.hidden?L.mapBtn:L.mapClose;return}
 el('mapToggle').disabled=true;el('mapInfo').textContent=L.mapReady;
 try{
  if(!window.L){
   await new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
    script.integrity='sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=';
    script.crossOrigin='anonymous';script.onload=resolve;script.onerror=reject;
    document.head.append(script);
   });
  }
  mount.hidden=false;
  const LMap=window.L;mapInstance=LMap.map(mount,{scrollWheelZoom:false});
  LMap.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
   maxZoom:18,attribution:'&copy; OpenStreetMap contributors'
  }).addTo(mapInstance);
  const bounds=LMap.latLngBounds([]);
  for(const p of points){
   const coord=[Number(p.public_lat),Number(p.public_lng)];
   if(!Number.isFinite(coord[0])||!Number.isFinite(coord[1]))continue;
   // Avoid HTML injection from property titles; bind only a safe text label.
   const marker=LMap.circleMarker(coord,{radius:8,color:'#204a30',fillColor:'#90d19b',fillOpacity:1}).addTo(mapInstance);
   marker.bindTooltip(String(p.title||'#'+p.id));bounds.extend(coord);
  }
  if(bounds.isValid())mapInstance.fitBounds(bounds.pad(.18),{maxZoom:14});
  mapLoaded=true;el('mapToggle').textContent=L.mapClose;
  el('mapInfo').textContent=L.someMap;
  setTimeout(()=>mapInstance.invalidateSize(),0);
 }catch{mount.hidden=true;el('mapInfo').textContent=L.mapFail}
 finally{el('mapToggle').disabled=false}
}
(async()=>{
 try{
  const response=await fetch(API+'?api=data&'+(demo?'demo=1':'t='+encodeURIComponent(token)),{cache:'no-store'});
  if(!response.ok)throw Error('DATA_UNAVAILABLE');
  const data=await response.json();
  el('heading').textContent=demo?L.demoTitle:(data.title||L.listTitle);
  el('intro').textContent=demo?L.demoIntro:(data.intro||L.guest);
  document.title='NIDO Pro · '+(demo?L.demoTitle:(data.title||L.listTitle));
  const properties=Array.isArray(data.properties)?data.properties:[];
  for(const property of properties)el('list').append(card(property,demo?{}:(data.property_reasons||{})));
  el('status').textContent=properties.length?'':L.error;
  // Never reveal exact owner coordinates without explicit show_exact_location.
  const enabled=demo||data.show_map===true;
  mapAvailable=enabled?properties.filter(p=>typeof p.public_lat==='number'&&typeof p.public_lng==='number'):[];
  el('mapInfo').textContent=!enabled?L.mapOff:
    mapAvailable.length?L.someMap+' ('+mapAvailable.length+'/'+properties.length+')':L.noMap;
  if(mapAvailable.length){
   const toggle=el('mapToggle');toggle.hidden=false;toggle.textContent=L.mapBtn;
   toggle.addEventListener('click',()=>void showMap(mapAvailable));
  }
  if(!demo&&token&&sessionStorage){
   try{
    const saved=JSON.parse(sessionStorage.getItem('nido:guestplan:'+token)||'null');
    if(saved&&/^[a-f0-9]{64}$/.test(saved.receipt)&&/^[0-9a-f-]{36}$/i.test(saved.request_key)){
     currentRequest=saved;await statusPlan();
    }
   }catch{}
  }
 }catch{
  el('heading').textContent=L.error;el('status').textContent=L.error;
  el('mapInfo').textContent=L.noMap;
 }
})();
</script>
